<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Safe Space</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --sf:#101010; --sf2:#1a1a1a; --ln:#2b2b2b;
  --tx:#fff; --mu:#8d8d8d; --inv-bg:#fff; --inv-tx:#000;
  --nav-h:68px;
}
:root[data-theme="light"]{
  --bg:#fff; --sf:#f4f4f4; --sf2:#eaeaea; --ln:#dadada;
  --tx:#000; --mu:#6a6a6a; --inv-bg:#000; --inv-tx:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
#app{max-width:520px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:var(--bg);
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 0 10px}
.brand{font:700 15px 'Unbounded',sans-serif;letter-spacing:-.01em}
.sos-pill{border:1.5px solid var(--tx);background:transparent;border-radius:999px;
  padding:7px 14px;font-weight:600;font-size:14px}
.sos-pill:active{background:var(--tx);color:var(--bg)}

h1{font:700 26px/1.15 'Unbounded',sans-serif;letter-spacing:-.02em;margin:8px 0 6px}
h2{font:500 17px/1.3 'Unbounded',sans-serif;margin:20px 0 10px}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--mu);font-size:14px}
.sp{height:12px}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:16px;margin:0 0 12px}
.card.inv{background:var(--inv-bg);color:var(--inv-tx);border-color:var(--inv-bg)}
.card.tap{width:100%;text-align:left;display:block}
.card.tap:active{background:var(--sf2)}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;
  font-weight:600;font-size:16px;background:var(--tx);color:var(--bg);
  text-align:center;text-decoration:none}
.btn:active{opacity:.8}
.btn.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--ln)}
.btn.sm{width:auto;display:inline-block;padding:10px 16px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn small{display:block;font-weight:400;font-size:13px;opacity:.7;margin-top:2px}
.btn + .btn{margin-top:10px}
.link{background:none;border:0;padding:4px 0;text-decoration:underline;color:var(--mu);font-size:14px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;
  border:1px solid var(--ln);background:var(--sf);font-size:14px;margin:0 6px 6px 0}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:3px}
.inv .bar{background:rgba(127,127,127,.4)}

/* hero: главный элемент экрана */
.hero{padding:20px 20px 18px}
.hero-top{font-size:14px;font-weight:500;opacity:.75}
.hero .big{font:700 92px/1 'Unbounded',sans-serif;letter-spacing:-.05em;margin:10px 0 2px}
.hero-unit{font:500 18px 'Unbounded',sans-serif}
.hero .live{margin:10px 0 16px;font-size:15px;opacity:.75;font-variant-numeric:tabular-nums}
.hero-next{font-size:13px;margin-top:8px;opacity:.8}

.moods{display:flex;gap:8px}
.moods button{flex:1;border:1px solid var(--ln);background:var(--sf2);border-radius:14px;padding:11px 0;font-size:26px;line-height:1}
.moods button.on{background:var(--tx);border-color:var(--tx)}
.moods button:active{transform:scale(.94)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px;text-align:left;min-height:92px;
  display:flex;flex-direction:column;justify-content:space-between}
.tile:active{background:var(--sf2)}
.tile .e{font-size:28px;line-height:1}
.tile .t{font-weight:500;font-size:15px}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 10px}
.stat b{display:block;font:700 22px 'Unbounded',sans-serif;letter-spacing:-.03em}
.stat span{font-size:12px;color:var(--mu)}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:1px solid var(--ln);border-radius:16px;padding:12px 6px;text-align:center;background:var(--sf)}
.badge .e{font-size:28px;display:block}
.badge span{font-size:11px;line-height:1.2;display:block;margin-top:4px}
.badge.lock{opacity:.3;filter:grayscale(1)}

.opt{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);
  border-radius:16px;padding:14px 16px;margin:8px 0}
.opt:active{background:var(--tx);color:var(--bg)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:8px 0 8px;font-size:14px;color:var(--mu)}
.q{font:500 20px/1.35 'Unbounded',sans-serif;margin:22px 0 14px;letter-spacing:-.01em}
.pct{font:700 72px/1 'Unbounded',sans-serif;letter-spacing:-.05em}

.entry{border-top:1px solid var(--ln);padding:12px 0;white-space:pre-wrap;word-break:break-word}
.entry:first-child{border-top:0}
.entry .d{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-bottom:4px}
.entry .d button{background:none;border:0;color:var(--mu);font-size:14px;padding:0 0 0 12px}

textarea,input[type=text],input[type=number]{width:100%;background:var(--sf);border:1px solid var(--ln);
  border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
textarea:focus,input:focus{border-color:var(--tx)}
textarea{min-height:96px;resize:vertical}

.msg{max-width:86%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--sf);
  border:1px solid var(--ln);margin:8px 0;white-space:pre-wrap;word-break:break-word}
.msg.me{margin-left:auto;background:var(--tx);color:var(--bg);border-color:var(--tx);border-radius:18px 18px 6px 18px}
.acts{margin:-2px 0 6px}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:var(--bg);padding:8px 16px;border-top:1px solid var(--ln);z-index:4}
.composer-in{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center}

.orb{width:240px;height:240px;margin:20px auto 14px;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center}
.orb i{display:block;width:100%;height:100%;border-radius:50%;background:var(--tx);transform:scale(.55);
  transition-property:transform;transition-timing-function:ease-in-out;transition-duration:1s}
.center{text-align:center}
.phase{font:500 20px 'Unbounded',sans-serif;min-height:30px}
.timer{font:700 64px/1 'Unbounded',sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:14px 0}

.week{display:flex;align-items:flex-end;gap:8px;height:150px;margin:6px 0 4px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
.col .b{width:100%;border-radius:8px;background:var(--tx);min-height:4px}
.col.none .b{background:var(--ln)}
.col .em{font-size:18px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:600;white-space:nowrap}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--ln);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav .in{width:100%;max-width:520px;display:flex}
nav button{flex:1;background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--mu)}
nav button .e{font-size:20px;width:46px;height:30px;display:grid;place-items:center;border-radius:15px;filter:grayscale(1)}
nav button.on{color:var(--tx);font-weight:600}
nav button.on .e{background:var(--tx);filter:none}

#modal{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.sheet{width:100%;max-width:520px;background:var(--sf);border:1px solid var(--ln);border-radius:26px 26px 0 0;
  padding:22px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin-top:0}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;
  background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;
  max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

.rich p{margin:0 0 10px}
.rich ul,.rich ol{padding-left:20px;margin:0 0 10px}
.rich li{margin-bottom:6px}
.sos-contact{text-align:left;display:flex;align-items:center;gap:12px}
.sos-contact .e{font-size:26px}


/* материалы, видео-уроки, копилка */
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--ln);background:var(--sf2)}
details.card summary{cursor:pointer;font-weight:600;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:8px}
.vidw{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin:0 0 12px}
.vidw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
video.vid{width:100%;aspect-ratio:16/9;border-radius:18px;margin:0 0 12px;background:#000}
/* постеры видео */
.vbox{margin:0 0 12px}
.vcard,.pst{position:relative;display:block;width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--ln);padding:0;text-align:left;color:#fff;
  background:radial-gradient(120% 140% at 85% 0%,#3a3a3a 0%,#161616 55%,#080808 100%)}
.vcard{aspect-ratio:16/9}
.pst{aspect-ratio:2/1;margin:0 0 12px}
.vcard:active,.pst:active{transform:scale(.99)}
.vcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vcard::after,.pst::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0) 62%)}
.ve{position:absolute;left:16px;top:10px;font-size:58px;line-height:1;z-index:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.vp{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:2;width:54px;height:54px;border-radius:50%;
  background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.vp::before{content:"";margin-left:4px;border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent #000}
.pst.lk{opacity:.7}
.pst.lk .vp::before{border:0;margin:0;content:"🔒";font-size:22px}
.vt{position:absolute;left:16px;right:84px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:2px}
.vt b{font-size:15px;line-height:1.25}
.vt small{font-size:12px;opacity:.85}
.pst .ok{position:absolute;right:12px;top:10px;z-index:2;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#000}
.vlink{display:block;margin:6px 0 0;font-size:13px;color:var(--mu);background:none;border:0;padding:4px 0;text-decoration:underline}
.lp{display:flex;flex-direction:column;min-height:calc(100vh - 150px)}
.lp-seg{display:flex;gap:4px;margin:4px 0 10px}
.lp-seg i{flex:1;height:4px;border-radius:2px;background:var(--ln);overflow:hidden}
.lp-seg b{display:block;height:100%;width:0;background:var(--tx)}
.lp-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.lp-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 4px;min-height:340px}
.lp-z{position:absolute;top:0;bottom:0;background:none;border:0;z-index:2;padding:0}
.lp-z.l{left:0;width:30%}
.lp-z.r{right:0;width:70%}
.lp-stage.done .lp-z{display:none}
.sc{position:relative;z-index:1;width:100%;animation:scIn .35s ease both}
.sc-e{font-size:84px;line-height:1;margin-bottom:18px;display:inline-block}
.sc-t{font:700 24px/1.2 'Unbounded',sans-serif;margin:0 0 12px;letter-spacing:-.02em}
.sc-s{font-size:18px;line-height:1.5;margin:0 auto;max-width:420px}
.lp-ctl{display:flex;gap:8px;justify-content:center;margin-top:8px}
.lp-ctl .btn + .btn{margin-top:0}
@keyframes scIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes breath{0%,100%{transform:scale(.8)}50%{transform:scale(1.25)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wave{0%,100%{transform:translateX(-8px) rotate(-4deg)}50%{transform:translateX(8px) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.a-pulse{animation:pulse 2.2s ease-in-out infinite}
.a-breath{animation:breath 5s ease-in-out infinite}
.a-float{animation:floaty 2.6s ease-in-out infinite}
.a-wave{animation:wave 3s ease-in-out infinite}
.a-pop{animation:pop .6s ease both}
.big-money{font:700 40px/1.1 'Unbounded',sans-serif;letter-spacing:-.03em;margin:10px 0 6px;font-variant-numeric:tabular-nums;word-break:break-word}
@media (prefers-reduced-motion:reduce){.a-pulse,.a-breath,.a-float,.a-wave,.sc{animation:none!important}}

:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.orb i{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">⚪ Safe Space</div>
    <button class="sos-pill" id="sosPill" data-act="go" data-s="sos">🆘 SOS</button>
  </header>
  <main id="view"></main>
</div>

<nav id="nav"><div class="in">
  <button data-act="tab" data-t="home"><span class="e">🏠</span>Главная</button>
  <button data-act="tab" data-t="quiz"><span class="e">🧠</span>Тесты</button>
  <button data-act="tab" data-t="journal"><span class="e">📓</span>Дневник</button>
  <button data-act="tab" data-t="chat"><span class="e">💬</span>Помощник</button>
  <button data-act="tab" data-t="profile"><span class="e">👤</span>Профиль</button>
</div></nav>

<div id="modal"></div>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ═════════════ НАСТРОЙКИ (меняй под свою страну/аудиторию) ═════════════ */
const CONFIG = {
  currency: '₽',
  hotlineName: 'Телефон доверия для детей и подростков',
  hotlinePhone: '88002000122',

const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

/* ═════════════ КОНТЕНТ ═════════════ */
const MILESTONES = [
  [1,'🌱','Первый шаг'],[3,'🔥','Три дня силы'],[7,'🥇','Неделя контроля'],
  [14,'💎','Две недели ясности'],[30,'🏆','Месяц свободы'],[60,'🚀','Два месяца роста'],
  [90,'🛡️','Квартал стойкости'],[180,'🌟','Полгода новой жизни'],[365,'👑','Год трезвости'],
];

const MOODS = [[1,'😞','Тяжело'],[2,'😕','Так себе'],[3,'😐','Нормально'],[4,'🙂','Хорошо'],[5,'😄','Отлично']];

const OPTIONS = [
  'Найду здоровый способ справиться',
  'Дистанцируюсь от этого триггера',
  'Будет тяжело удержаться',
  'Рискую сдаться под давлением',
];
const SCORES = [3,2,1,0];

const QUIZ_META = {
  A:['🧨','Мои триггеры зависимости'],
  B:['👥','Давление окружения'],
  C:['🛡️','Психологическая защита'],
};
const SITUATIONS = {
  A:[
    'Тебя зовут на вечеринку, где главным развлечением будет алкоголь.',
    'После тяжелого дня появляется мысль, что выпивка поможет расслабиться.',
    'Знакомые утверждают, что алкоголь необходим для лёгкого общения.',
    'Приятель предлагает выпить одну банку пива, утверждая, что это безопасно.',

    'Ты испытываешь сильный стресс из-за учебы или личных проблем.',

    'Близкий друг начинает регулярно выпивать и зовёт тебя с собой.',
    'Появляется иллюзия, что алкоголь решает внутренние психологические проблемы.',

  B:[
    'Ты сталкиваешься с непониманием в семье и ищешь способ забыться.',

    'Появляется страх стать белой вороной среди сверстников из-за трезвости.',

    'Знакомые предлагают попробовать новый дорогой спиртной напиток.',

/* Банк вопросов: в каждом тесте по 30 ситуаций, при каждом прохождении берутся 10 случайных
   (сначала те, что давно не попадались), а варианты ответов перемешиваются. Править ничего не нужно. */
const MORE_Q = {

const cdStr = ms => { const s=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h>0 ? `${h} ч ${pad(m)} мин` : `${m} мин ${pad(s%60)} с`; };
function pickQuestions(id){
  const n = SITUATIONS[id].length, all = [...Array(n).keys()];

const streakMs = () => S.soberSince ? Math.max(0, Date.now()-S.soberSince) : 0;
const streakDays = () => Math.floor(streakMs()/864e5);
function liveStr(){
  const ms=streakMs(), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
  return `${h} ч ${pad(m)} мин ${pad(s)} с`;
}
function leftStr(ms){
  const h=Math.floor(ms/36e5), m=Math.floor((ms%36e5)/6e4);
  return h>0 ? `${h} ч ${m} мин` : `${m} мин`;
}
/* Сэкономлено = накопленное до последнего изменения + сколько набежало с тех пор.
   Срыв или смена суммы «замораживают» уже накопленное, а не обнуляют его. */
function savedMoney(){
  const base = S.savedBase || 0;
  if(!S.soberSince || !S.weeklySpend) return Math.round(base);
  const from = Math.max(S.savedFrom || 0, S.soberSince);
  return Math.round(base + Math.max(0, Date.now()-from)/864e5 * S.weeklySpend/7);
}
const fmtMoney = n => Math.round(n).toLocaleString('ru-RU') + ' ' + CONFIG.currency;
function setWeekly(v){
  v = Math.max(0, Math.min(1e6, Math.round(v)||0));
  const old = S.weeklySpend || 0;
  if(old>0){ S.savedBase = savedMoney(); S.savedFrom = Date.now(); }
  else if(S.savedFrom){ S.savedFrom = Date.now(); }
  S.weeklySpend = v; save();
}
function todayMood(){ return S.moods[dateKey()] || 0; }

function checkMilestones(announce){
  const d = streakDays();
  const fresh = MILESTONES.filter(m => d>=m[0] && !S.milestones.includes(m[0]));
  if(!fresh.length) return;
  S.milestones = [...S.milestones, ...fresh.map(m=>m[0])].sort((a,b)=>a-b);
  const coins = fresh.reduce((sum,m)=> sum + 20*MILESTONES.findIndex(x=>x[0]===m[0]) + 20, 0);
  S.balance += coins; save();
  if(announce){
    hap('success');
    sheet(`<h2>🎉 Новая награда!</h2>
      <p style="font-size:30px;margin:6px 0">${fresh.map(m=>m[1]+' '+esc(m[2])).join('<br>')}</p>
      <p>Начислено дополнительно <b>+${coins} ◇</b>. Это честно заработанный результат — гордись им.</p>
      <button class="btn" data-act="mno">Отлично</button>`);
  }
}

async function breathRun(){
  const id = ++BR.id; BR.running = true; paintBreathBtn();
  const steps = PATTERNS[BR.pat].steps;
  for(let c=1;c<=5;c++){
    const cyc=$('#cyc'); if(cyc) cyc.textContent = `Круг ${c} из 5`;
    for(const [label,sec,scale] of steps){
      const orb=$('#orb'); if(BR.id!==id || !orb) return;
      orb.style.transitionDuration = sec+'s'; orb.style.transform = `scale(${scale})`;
      hap('light');
      for(let s=sec;s>0;s--){
        const tx=$('#orbTx'); if(BR.id!==id || !tx) return;
        tx.textContent = `${label} · ${s}`; await sleep(1000);
      }

function lpShow(i){
  const it=ITEMS[LP.k]; if(!it) return;

  const st=$('#lpStage'); if(st) st.classList.remove('done');

  it.scenes.forEach((_,j)=>{ const b=$('#sg'+j); if(b) b.style.width = j<i ? '100%' : '0%'; });

function lpTick(){
  if(LP.paused || LP.done || document.hidden) return;
  const it=ITEMS[LP.k]; if(!it) return;
  const s=it.scenes[LP.i]; LP.el+=100;
  const b=$('#sg'+LP.i); if(b) b.style.width=Math.min(100,LP.el/(s.sec*10))+'%';
  if(LP.el>=s.sec*1000) lpNext();
}
function lpNext(){ const it=ITEMS[LP.k]; if(!it||LP.done) return; if(LP.i<it.scenes.length-1) lpShow(LP.i+1); else lpFinish(); }

  <a class="btn ghost sos-contact" href="tel:${CONFIG.hotlinePhone}"><span class="e">📞</span><span>${CONFIG.hotlineLabel}<small>${esc(CONFIG.hotlineName)} · бесплатно и анонимно</small></span></a>
  <a class="btn ghost sos-contact" href="tel:${CONFIG.emergency}"><span class="e">🚨</span><span>${CONFIG.emergency}<small>Если есть угроза жизни прямо сейчас</small></span></a>
  <button class="btn ghost sos-contact" data-act="open" data-u="${esc(CONFIG.onlineChatUrl)}"><span class="e">💬</span><span>Онлайн-чат с психологом<small>${esc(CONFIG.onlineChatUrl.replace('https://',''))}</small></span></button>
  ${S.reasons.length ? `<h2>Твои причины</h2><section class="card inv">${S.reasons.map(r=>`<p style="margin:0 0 6px">🎯 ${esc(r)}</p>`).join('')}</section>` : ''}
  <h2>Что ещё можно</h2>
  <button class="btn ghost" data-act="go" data-s="craving">⏳ Переждать тягу</button>
  <button class="btn ghost" data-act="relapseask">🔄 Я сорвался(-ась) — начать заново</button>
  <div class="sp"></div>
  <button class="link" data-act="back">← Вернуться</button>`;

/* ── Тесты ── */
screens.quiz = () => `<h1>Тесты 🧠</h1>
  <p class="muted">Вопросы каждый раз подбираются заново. Новый тест открывается через ${QUIZ_CD/36e5} ч после прошлого. За первый тест дня — +50 ◇, за повторные — +10 ◇.</p>
  ${Object.entries(QUIZ_META).map(([id,m])=>{
    const wait = QUIZ_CD - (Date.now() - (S.qAt[id]||0)), locked = wait>0;
    return `<button class="card tap" data-act="quizstart" data-id="${id}">
      <div class="row"><span><span style="font-size:26px">${m[0]}</span>&nbsp; ${m[1]}</span><span>${locked?'⏳':'›'}</span></div>
      ${locked ? `<span class="muted">Новый тест через <b id="qw${id}" data-lock="1">${cdStr(wait)}</b></span>`
               : `<span class="muted" id="qw${id}">10 вопросов · около 2 минут · +${rewardFor(id)} ◇</span>`}</button>`;}).join('')}
  <h2>Последние результаты</h2>
  ${S.history.length ? S.history.slice(-5).reverse().map(h=>`<section class="card row"><div><b>${QUIZ_META[h.type][0]} ${QUIZ_META[h.type][1]}</b><br><span class="muted">${h.date} · ${esc(h.trend)}</span></div><div class="price" style="font-size:22px">${h.percent}%</div></section>`).join('') : '<section class="card muted">История пуста. Пройди первый тест.</section>'}`;
screens.quizrun = () => {
  const n = Q.idx.length;
  return `<div class="qhead"><span>${QUIZ_META[Q.id][0]} Вопрос ${Q.i+1} из ${n}</span><button class="link" data-act="quizquit">Выйти</button></div>
  <div class="bar"><i style="width:${Q.i/n*100}%"></i></div>
  <h2 class="q">${esc(SITUATIONS[Q.id][Q.idx[Q.i]])}</h2>
  ${Q.ord[Q.i].map(oi=>`<button class="opt" data-act="ans" data-i="${oi}">${OPTIONS[oi]}</button>`).join('')}`;
};
screens.quizres = r => {
  const v = r.pct>=75 ? ['✅','Низкий','Ты хорошо видишь ловушки и умеешь выстраивать личные границы.']
          : r.pct>=45 ? ['⚠️','Средний','В сложные моменты или под влиянием друзей тебе может быть непросто удержаться. Загляни в материал «Фильтр окружения».']
          : ['🆘','Высокий','Сейчас тебе может быть особенно тяжело справляться самому(-ой). Воспользуйся SOS или линией доверия — это нормально.'];
  return `<div class="center"><div style="font-size:44px">${v[0]}</div><div class="pct">${r.pct}%</div><p class="muted">устойчивости · ${esc(r.trend)}</p></div>
  <section class="card"><h3>Уровень риска: ${v[1]}</h3><p style="margin:0">${v[2]}</p></section>
  <section class="card inv"><p style="margin:0">💰 На баланс начислено <b>+${r.reward} ◇</b>.</p></section>
  ${r.pct<45 ? '<button class="btn" data-act="go" data-s="sos">🆘 Открыть помощь</button>' : ''}
  <button class="btn ${r.pct<45?'ghost':''}" data-act="tab" data-t="home">На главную</button>`;
};

/* ── Дневник ── */
screens.journal = () => `
  <h1>Дневник 📓</h1>
  <p class="muted">Личное анонимное пространство. Записи хранятся только на этом устройстве.</p>
  <textarea id="jText" maxlength="500" placeholder="Что происходит и что ты чувствуешь?"></textarea>
  <div style="margin-top:8px">${JOURNAL_PROMPTS.map((p,i)=>`<button class="chip" data-act="jprompt" data-i="${i}">💭 ${esc(p)}</button>`).join('')}</div>
  <button class="btn" data-act="jsave">Сохранить запись</button>
  <h2>Мои записи</h2>
  ${S.journal.length ? `<section class="card">${S.journal.slice().reverse().map(e=>`
    <div class="entry"><div class="d"><span>${new Date(e.t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span><button data-act="jdel" data-t="${e.t}" aria-label="Удалить">🗑</button></div>${esc(e.text)}</div>`).join('')}</section>`
    : '<section class="card muted">Пока пусто. Первая запись — самая трудная, дальше проще.</section>'}`;

/* ── Помощник ── */
const msgHtml = m => `<div class="msg ${m.me?'me':''}">${esc(m.text)}</div>` +
  (m.acts ? `<div class="acts">${m.acts.map(a=>`<button class="chip" data-act="go" data-s="${a[0]}">${a[1]}</button>`).join('')}</div>` : '');
screens.chat = () => {
  if(!chatLog.length) chatLog.push({text:'Привет 🤍 Я рядом. Напиши своими словами, что происходит — подскажу, что можно сделать. Я работаю по простым правилам, а не как живой человек, и не заменяю близких или специалиста.'});
  return `<h1>Помощник 💬</h1><p class="muted">Переписка нигде не сохраняется.</p>
  <div id="msgs">${chatLog.map(msgHtml).join('')}</div><div style="height:64px"></div>
  <div class="composer"><div class="composer-in"><input type="text" id="chatIn" maxlength="400" placeholder="Напиши, что происходит…" autocomplete="off"><button class="btn sm" data-act="chatsend" aria-label="Отправить">➤</button></div></div>`;
};
after.chat = () => { window.scrollTo(0, document.body.scrollHeight); };
function chatReply(text){
  const t = text.toLowerCase();
  if(CRISIS_KEYS.some(k=>t.includes(k))){
    return {text:`Мне важно то, что ты сейчас чувствуешь. Пожалуйста, не оставайся с этим один на один.\n\n📞 ${CONFIG.hotlineLabel} — ${CONFIG.hotlineName.toLowerCase()}, бесплатно и анонимно\n🚨 ${CONFIG.emergency} — если есть угроза жизни прямо сейчас`, acts:[['sos','🆘 Открыть помощь']]};
  }
  const cat = CHAT_CATS.find(c => c.keys.some(k=>t.includes(k))) || CHAT_DEFAULT;
  return {text:pick(cat.replies), acts:cat.acts};
}
function chatSend(){
  const inp=$('#chatIn'); if(!inp) return;
  const text=inp.value.trim(); if(!text) return;
  inp.value='';
  const box=$('#msgs'); const me={me:true,text}; chatLog.push(me); box.insertAdjacentHTML('beforeend',msgHtml(me));
  window.scrollTo(0, document.body.scrollHeight);
  setTimeout(()=>{
    if(cur.name!=='chat') return;
    const r=chatReply(text); chatLog.push(r); $('#msgs').insertAdjacentHTML('beforeend',msgHtml(r));
    hap('light'); window.scrollTo(0, document.body.scrollHeight);
  },500);
}

/* ── Профиль ── */
screens.profile = () => {
  const d = streakDays(), money = savedMoney();
  return `<h1>Профиль 👤</h1>
  <div class="stats">
    <div class="stat"><b>${d}</b><span>${plural(d,'день','дня','дней')} в серии</span></div>
    <div class="stat"><b>${S.soberDays}</b><span>отметок всего</span></div>
    <div class="stat"><b>${S.balance}</b><span>монет ◇</span></div>
    <div class="stat"><b>${S.cravings}</b><span>тяг пережито</span></div>
    <div class="stat"><b>${S.relapses}</b><span>честных перезапусков</span></div>
    <div class="stat"><b>${(S.pig||0).toLocaleString('ru-RU')}</b><span>в копилке, ${CONFIG.currency}</span></div>
  </div>
  <h2>Награды</h2>
  <div class="badges">${MILESTONES.map(m=>`<div class="badge ${S.milestones.includes(m[0])?'':'lock'}"><span class="e">${m[1]}</span><span>${esc(m[2])}</span></div>`).join('')}</div>
  <h2>Мои материалы</h2>
  ${S.inv.filter(k=>ITEMS[k]).length ? S.inv.filter(k=>ITEMS[k]).map(k=>`<button class="card tap" data-act="read" data-k="${k}"><div class="row"><span>${ITEMS[k].emoji} ${esc(ITEMS[k].title)}</span><span>›</span></div></button>`).join('')
    : `<section class="card muted">Пока нет. Загляни в <button class="link" data-act="go" data-s="shop">«Материалы»</button>.</section>`}
  <h2>Настройки</h2>
  <button class="card tap" data-act="go" data-s="savings"><div class="row"><span>🐷 Копилка и цель</span><span>›</span></div></button>
  <button class="card tap" data-act="theme"><div class="row"><span>🌗 Тема: ${S.theme==='auto'?'как в Telegram':S.theme==='dark'?'тёмная':'светлая'}</span><span>›</span></div></button>
  <button class="card tap" data-act="relapseask"><div class="row"><span>🔄 Я сорвался(-ась) — начать заново</span><span>›</span></div></button>
  <button class="card tap" data-act="erase"><div class="row"><span>🗑 Стереть все мои данные</span><span>›</span></div></button>
  <p class="muted">Всё, что ты вводишь, хранится только на этом устройстве. Если стереть данные или сменить устройство, прогресс не восстановить.</p>`;
};

/* ═════════════ ДЕЙСТВИЯ ═════════════ */
const A = {
  tab:d=>tab(d.t), go:d=>go(d.s), back:()=>back(),
  mno:()=>closeSheet(), mok:()=>{ const f=pendingFn; closeSheet(); if(f) f(); },
  open:d=>openUrl(d.u),

  claim(){
    const wait = 864e5 - (Date.now()-S.lastBonus);
    if(wait>0){ toast('⏳ Следующая отметка через '+leftStr(wait)); hap('warning'); return; }
    S.balance+=30; S.soberDays++; S.lastBonus=Date.now();
    if(!S.soberSince) S.soberSince=Date.now();
    save(); hap('success'); render(); toast('✅ Прогресс зафиксирован · +30 ◇');
    checkMilestones(true);
  },
  mood(d){ S.moods[dateKey()] = +d.v; save(); hap('light'); render(); toast(MOODS[d.v-1][1]+' Записано'); },
  tipnext(){ tipI=(tipI+1)%TIPS.length; render(); },

  brpat(d){ BR.pat=d.p; render(); },
  brstart(){ breathRun(); }, brstop(){ breathStop(); },

  cstart(){ S.craving={endAt:Date.now()+CRAVING_MS}; ideaI=Math.floor(Math.random()*IDEAS.length); save(); hap('light'); render(); },
  cidea(){ ideaI++; const el=$('#idea'); if(el) el.innerHTML=`<span class="muted">Попробуй сейчас</span><p style="font-size:18px;margin:6px 0 0">${IDEAS[ideaI%IDEAS.length]}</p>`; hap('light'); },
  ccancel(){ S.craving=null; save(); render(); },
  cclaim(){ S.balance+=15; S.cravings++; S.craving=null; save(); hap('success'); render(); toast('🎉 +15 ◇ — так держать'); },

  locate(){
    if(!navigator.geolocation){ toast('Геолокация недоступна — используй поиск по стране'); return; }
    navigator.geolocation.getCurrentPosition(
      p=>{ loc={lat:p.coords.latitude,lon:p.coords.longitude}; render(); toast('📍 Готово'); },
      ()=>toast('Не удалось получить геолокацию. Поиск по стране работает без неё.'),
      {timeout:10000});
  },

  shopf(d){ SHOP_F=d.f; render(); },
  buy(d){
    const it=ITEMS[d.k];
    if(!it || S.inv.includes(d.k)) return;
    if(S.balance<it.price){ toast('Не хватает '+(it.price-S.balance)+' ◇'); hap('warning'); return; }
    ask('Открыть материал?', `«${esc(it.title)}» — ${it.price} ◇.<br>После покупки у тебя останется ${S.balance-it.price} ◇.`, 'Открыть за '+it.price+' ◇', ()=>{
      if(S.inv.includes(d.k) || S.balance<it.price) return;
      S.balance-=it.price; S.inv.push(d.k); save(); hap('success'); openItem(d.k);
    });
  },
  read(d){ openItem(d.k); },
  vplay(d){ const box=document.getElementById(d.id); if(!box) return; hap('light');
    box.innerHTML = playerHtml(d.u) + `<button class="vlink" data-act="open" data-u="${esc(d.u)}">Не открывается? Смотреть на сайте ↗</button>`; },
  vdone(d){ if(!S.lessonDone.includes(d.k)){ S.lessonDone.push(d.k); save(); } hap('success'); toast('✅ Урок пройден'); render(); },
  lesson(d){ go('lesson',d.k); },
  lpnext(){ lpNext(); },
  lpprev(){ lpGo(LP.done ? LP.i : LP.i-1); },
  lprestart(){ lpGo(0); },
  lppause(){ LP.paused=!LP.paused; const b=$('#lpPause'); if(b) b.textContent = LP.paused ? '▶️ Продолжить' : '⏸ Пауза'; },
  plphrase(d){ const el=$('#plPhrase'); if(el) el.value=PLAN_PHRASES[+d.i]; },
  plexit(d){ const el=$('#plExit'); if(el) el.value=PLAN_EXITS[+d.i]; },
  plsave(){
    const g=id=>{ const e=$(id); return e ? e.value.trim().slice(0,80) : ''; };
    const p={event:g('#plEvent'),phrase:g('#plPhrase'),exit:g('#plExit'),ally:g('#plAlly')};
    if(!p.phrase){ toast('Выбери или напиши фразу-отказ'); hap('warning'); return; }
    S.plan=p; save(); hap('success'); render(); toast('🗓️ План сохранён');
  },

  reasonadd(){
    const el=$('#reasonIn'); const v=el && el.value.trim(); if(!v) return;
    if(S.reasons.length>=5) return;
    S.reasons.push(v.slice(0,80)); save(); hap('light'); render();
  },
  reasondel(d){ S.reasons.splice(+d.i,1); save(); render(); },

  relapseask(){
    ask('Это можно пройти','Срыв — не провал и не конец пути, а часть процесса, через который проходят многие. Счётчик можно честно обнулить и продолжить с чистого листа. Тесты, дневник, монеты, материалы и копилка останутся.','Да, обнулить счётчик',()=>{
      S.savedBase=savedMoney(); S.savedFrom=Date.now(); S.soberSince=Date.now(); S.relapses++; save(); hap('success'); tab('home'); toast('Счётчик обнулён. Я рядом — ты справишься.');
    });
  },

  quizstart(d){
    const wait = QUIZ_CD - (Date.now() - (S.qAt[d.id]||0));
    if(wait>0){ toast('Новый тест будет через '+cdStr(wait)); hap('warning'); return; }
    const p = pickQuestions(d.id);
    Q = {id:d.id, i:0, score:0, idx:p.idx, reset:p.reset, ord:p.idx.map(()=>shuffle([0,1,2,3]))};
    go('quizrun');
  },
  quizquit(){ Q=null; back(); },
  ans(d){
    if(!Q) return;
    Q.score+=SCORES[+d.i]; Q.i++; hap('light');
    const n=Q.idx.length;
    if(Q.i<n){ render(); return; }
    const pct=Math.round(Q.score/(n*3)*100), t=dateKey(), reward=rewardFor(Q.id);
    const last=S.history.length ? S.history[S.history.length-1].percent : null;
    const trend = last===null ? 'старт фиксации' : pct>last ? 'улучшение ▲' : pct<last ? 'ниже прошлого ▽' : 'стабильно';
    S.history.push({date:t,type:Q.id,percent:pct,trend}); S.history=S.history.slice(-30);
    S.seen[Q.id] = (Q.reset ? [] : (S.seen[Q.id]||[])).concat(Q.idx);
    S.qAt[Q.id]=Date.now(); S.qRew[Q.id]=t; S.done[Q.id]=t; S.balance+=reward; save(); Q=null;
    hap(pct>=45?'success':'warning'); go('quizres',{pct,trend,reward},true);
  },

  jprompt(d){ const el=$('#jText'); if(el){ el.value=JOURNAL_PROMPTS[+d.i]+'\n'; el.focus(); } },
  jsave(){
    const el=$('#jText'); const v=el && el.value.trim(); if(!v){ toast('Сначала напиши пару слов'); return; }
    S.journal.push({t:Date.now(),text:v.slice(0,500)}); S.journal=S.journal.slice(-30);
    save(); hap('success'); render(); toast('📓 Запись сохранена');
  },
  jdel(d){ ask('Удалить запись?','Это действие нельзя отменить.','Удалить',()=>{ S.journal=S.journal.filter(e=>String(e.t)!==d.t); save(); render(); }); },

  chatsend(){ chatSend(); },

  pigq(d){ const el=$('#pigIn'); if(el) el.value=(parseInt(el.value,10)||0)+(+d.v); },
  pigadd(){
    const v=pigVal(); if(!v) return;
    pigAdd(v); hap('success'); render(); toast('🐷 +'+fmtMoney(v));
    const g=S.goal;
    if(g && !g.done && S.pig>=g.cost){ g.done=true; save(); sheet(`<h2>🎉 Цель достигнута!</h2><p>Ты накопил(а) на «${esc(g.name)}». Это результат твоих решений — гордись им.</p><button class="btn" data-act="mno">Отлично</button>`); }
  },
  pigtake(){
    const v=pigVal(); if(!v) return;
    if(v>(S.pig||0)){ toast('В копилке только '+fmtMoney(S.pig||0)); hap('warning'); return; }
    pigAdd(-v); hap('light'); render(); toast('Взято '+fmtMoney(v));
  },
  pigundo(){ const e=S.pigLog.pop(); if(!e) return; S.pig=Math.max(0,(S.pig||0)-e.a); save(); hap('light'); render(); toast('Запись отменена'); },
  estdeposit(){
    const v=savedMoney(); if(v<=0){ toast('Пока считать нечего'); return; }
    pigAdd(v,'из расчёта'); S.savedBase=0; S.savedFrom=Date.now(); save(); hap('success'); render(); toast('🐷 +'+fmtMoney(v));
  },
  spendsave(){ const el=$('#spendIn'); setWeekly(parseInt(el&&el.value,10)||0); hap('success'); render(); toast('Сохранено'); },
  goalsave(){
    const n=$('#gName'), c=$('#gCost'); const name=n&&n.value.trim(), cost=parseInt(c&&c.value,10)||0;
    if(!name||cost<=0){ toast('Впиши, на что копишь и сколько это стоит'); hap('warning'); return; }
    S.goal={name:name.slice(0,40),cost:Math.min(cost,1e8)}; save(); hap('success'); render(); toast('🎯 Цель сохранена');
  },
  goaldel(){ S.goal=null; save(); render(); },
  theme(){ S.theme = S.theme==='auto'?'dark':S.theme==='dark'?'light':'auto'; save(); applyTheme(); render(); },
  erase(){
    ask('Стереть все данные?','Прогресс, дневник, тесты, монеты и причины будут удалены с этого устройства навсегда.','Стереть всё',()=>{
      try{ localStorage.removeItem(KEY); }catch(e){}
      S=defaults(); memStore=null; chatLog=[]; applyTheme(); tab('home'); toast('Данные стёрты');
    });
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const f = A[el.dataset.act];
  if(f) f(el.dataset, el);
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target && e.target.id==='chatIn'){ e.preventDefault(); chatSend(); }
  if(e.key==='Enter' && e.target && e.target.id==='reasonIn'){ e.preventDefault(); A.reasonadd(); }
});

/* живой счётчик на главной */
setInterval(()=>{
  if(cur.name==='quiz'){   // обратный отсчёт; когда тест откроется — экран обновится сам
    for(const id of Object.keys(QUIZ_META)){
      const e=$('#qw'+id); if(!e || e.dataset.lock!=='1') continue;
      const w=QUIZ_CD-(Date.now()-(S.qAt[id]||0));
      if(w<=0){ render(); return; }
      e.textContent=cdStr(w);
    }
    return;
  }
  if(cur.name!=='home') return;
  if(!S.soberSince) return;
  const l=$('#hLive'); if(l) l.textContent=liveStr();
  const d=streakDays(), el=$('#hDays');
  if(el && el.textContent!==String(d)){ el.textContent=d; const u=$('#hUnit'); if(u) u.textContent=plural(d,'день','дня','дней'); }
},1000);

/* старт */
render();
checkMilestones(true);
})();
</script>
</body>
</html>
