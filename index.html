<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Safe Space</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --sf:#101010; --sf2:#1a1a1a; --ln:#2b2b2b;
  --tx:#fff; --mu:#8d8d8d; --inv-bg:#fff; --inv-tx:#000;
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
#app{max-width:520px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:var(--bg);
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 0 10px}
.brand{font:700 15px 'Unbounded',sans-serif;letter-spacing:-.01em}
.sos-pill{border:1.5px solid var(--tx);background:transparent;border-radius:999px;
  padding:7px 14px;font-weight:600;font-size:14px}
.sos-pill:active{background:var(--tx);color:var(--bg)}

h1{font:700 26px/1.15 'Unbounded',sans-serif;letter-spacing:-.02em;margin:8px 0 6px}
h2{font:500 17px/1.3 'Unbounded',sans-serif;margin:20px 0 10px}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--mu);font-size:14px}
.sp{height:12px}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:16px;margin:0 0 12px}
.card.inv{background:var(--inv-bg);color:var(--inv-tx);border-color:var(--inv-bg)}
.card.tap{width:100%;text-align:left;display:block}
.card.tap:active{background:var(--sf2)}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;
  font-weight:600;font-size:16px;background:var(--tx);color:var(--bg);
  text-align:center;text-decoration:none}
.btn:active{opacity:.8}
.btn.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--ln)}
.btn.sm{width:auto;display:inline-block;padding:10px 16px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn small{display:block;font-weight:400;font-size:13px;opacity:.7;margin-top:2px}
.btn + .btn{margin-top:10px}
.link{background:none;border:0;padding:4px 0;text-decoration:underline;color:var(--mu);font-size:14px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;
  border:1px solid var(--ln);background:var(--sf);font-size:14px;margin:0 6px 6px 0}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:3px}
.inv .bar{background:rgba(127,127,127,.4)}

/* hero: главный элемент экрана */
.hero{padding:20px 20px 18px}
.hero-top{font-size:14px;font-weight:500;opacity:.75}
.hero .big{font:700 92px/1 'Unbounded',sans-serif;letter-spacing:-.05em;margin:10px 0 2px}
.hero-unit{font:500 18px 'Unbounded',sans-serif}
.hero .live{margin:10px 0 16px;font-size:15px;opacity:.75;font-variant-numeric:tabular-nums}
.hero-next{font-size:13px;margin-top:8px;opacity:.8}

.moods{display:flex;gap:8px}
.moods button{flex:1;border:1px solid var(--ln);background:var(--sf2);border-radius:14px;padding:11px 0;font-size:26px;line-height:1}
.moods button.on{background:var(--tx);border-color:var(--tx)}
.moods button:active{transform:scale(.94)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px;text-align:left;min-height:92px;
  display:flex;flex-direction:column;justify-content:space-between}
.tile:active{background:var(--sf2)}
.tile .e{font-size:28px;line-height:1}
.tile .t{font-weight:500;font-size:15px}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 10px}
.stat b{display:block;font:700 22px 'Unbounded',sans-serif;letter-spacing:-.03em}
.stat span{font-size:12px;color:var(--mu)}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:1px solid var(--ln);border-radius:16px;padding:12px 6px;text-align:center;background:var(--sf)}
.badge .e{font-size:28px;display:block}
.badge span{font-size:11px;line-height:1.2;display:block;margin-top:4px}
.badge.lock{opacity:.3;filter:grayscale(1)}

.opt{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);
  border-radius:16px;padding:14px 16px;margin:8px 0}
.opt:active{background:var(--tx);color:var(--bg)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:8px 0 8px;font-size:14px;color:var(--mu)}
.q{font:500 20px/1.35 'Unbounded',sans-serif;margin:22px 0 14px;letter-spacing:-.01em}
.pct{font:700 72px/1 'Unbounded',sans-serif;letter-spacing:-.05em}

.entry{border-top:1px solid var(--ln);padding:12px 0;white-space:pre-wrap;word-break:break-word}
.entry:first-child{border-top:0}
.entry .d{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-bottom:4px}
.entry .d button{background:none;border:0;color:var(--mu);font-size:14px;padding:0 0 0 12px}

textarea,input[type=text],input[type=number]{width:100%;background:var(--sf);border:1px solid var(--ln);
  border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
textarea:focus,input:focus{border-color:var(--tx)}
textarea{min-height:96px;resize:vertical}

.msg{max-width:86%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--sf);
  border:1px solid var(--ln);margin:8px 0;white-space:pre-wrap;word-break:break-word}
.msg.me{margin-left:auto;background:var(--tx);color:var(--bg);border-color:var(--tx);border-radius:18px 18px 6px 18px}
.acts{margin:-2px 0 6px}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.chat-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.logo{height:19px;display:block}
#splash{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .45s}
#splash video{max-width:86%;max-height:52vh;border-radius:18px}
#splash .skip{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top));background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-size:14px}
#splash .logo-big{width:min(72%,300px);margin-bottom:22px}
#splash .hello{font:700 30px/1.2 'Unbounded',sans-serif;color:#fff;letter-spacing:-.02em;animation:scIn .5s ease both}
#onboard{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:none;flex-direction:column;align-items:center;justify-content:flex-end;transition:opacity .45s}
.ob-card{width:100%;max-width:520px;background:var(--sf);border:1px solid var(--ln);border-radius:26px 26px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
.gone{opacity:0!important;pointer-events:none!important}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:var(--bg);padding:8px 16px;border-top:1px solid var(--ln);z-index:4}
.composer-in{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center}

.orb{width:240px;height:240px;margin:20px auto 14px;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.orb i{display:block;width:100%;height:100%;border-radius:50%;background:var(--tx);transform:scale(.55);
  will-change:transform;pointer-events:none}
.center{text-align:center}
.phase{font:500 20px 'Unbounded',sans-serif;min-height:30px}
.timer{font:700 64px/1 'Unbounded',sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:14px 0}

.week{display:flex;align-items:flex-end;gap:8px;height:150px;margin:6px 0 4px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
.col .b{width:100%;border-radius:8px;background:var(--tx);min-height:4px}
.col.none .b{background:var(--ln)}
.col .em{font-size:18px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:600;white-space:nowrap}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--ln);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav .in{width:100%;max-width:520px;display:flex}
nav button{flex:1;background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--mu)}
nav button .e{font-size:20px;width:46px;height:30px;display:grid;place-items:center;border-radius:15px;filter:grayscale(1)}
nav button.on{color:var(--tx);font-weight:600}
nav button.on .e{background:var(--tx);filter:none}

#modal{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.sheet{width:100%;max-width:520px;background:var(--sf);border:1px solid var(--ln);border-radius:26px 26px 0 0;
  padding:22px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin-top:0}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;
  background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;
  max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

.rich p{margin:0 0 10px}
.rich ul,.rich ol{padding-left:20px;margin:0 0 10px}
.rich li{margin-bottom:6px}
.sos-contact{text-align:left;display:flex;align-items:center;gap:12px}
.sos-contact .e{font-size:26px}


/* материалы, видео-уроки, копилка */
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--ln);background:var(--sf2)}
details.card summary{cursor:pointer;font-weight:600;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:8px}
.vidw{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin:0 0 12px}
.vidw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
video.vid{width:100%;aspect-ratio:16/9;border-radius:18px;margin:0 0 12px;background:#000}
/* постеры видео */
.vbox{margin:0 0 12px}
.vcard,.pst{position:relative;display:block;width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--ln);padding:0;text-align:left;color:#fff;
  background:radial-gradient(120% 140% at 85% 0%,#3a3a3a 0%,#161616 55%,#080808 100%)}
.vcard{aspect-ratio:16/9}
.pst{aspect-ratio:2/1;margin:0 0 12px}
.vcard:active,.pst:active{transform:scale(.99)}
.vcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vcard::after,.pst::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0) 62%)}
.ve{position:absolute;left:16px;top:10px;font-size:58px;line-height:1;z-index:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.vp{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:2;width:54px;height:54px;border-radius:50%;
  background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.vp::before{content:"";margin-left:4px;border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent #000}
.pst.lk{filter:grayscale(1);opacity:.7}
.card.locked{background:var(--sf2);border-style:dashed}
.card.locked .em{filter:grayscale(1);opacity:.6}
.card.locked h3,.card.locked p.muted{opacity:.7}
.lockb{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--tx);color:var(--bg)}
.vp.nx::before{border:0;margin:0;content:"›";font-size:34px;line-height:1;color:#000;padding-bottom:4px}
.pst.lk .vp::before{border:0;margin:0;content:"🔒";font-size:22px}
.vt{position:absolute;left:16px;right:84px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:2px}
.vt b{font-size:15px;line-height:1.25}
.vt small{font-size:12px;opacity:.85}
.pst .ok{position:absolute;right:12px;top:10px;z-index:2;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#000}
.vlink{display:block;margin:6px 0 0;font-size:13px;color:var(--mu);background:none;border:0;padding:4px 0;text-decoration:underline}
.lp{display:flex;flex-direction:column;min-height:calc(100vh - 150px)}
.lp-seg{display:flex;gap:4px;margin:4px 0 10px}
.lp-seg i{flex:1;height:4px;border-radius:2px;background:var(--ln);overflow:hidden}
.lp-seg b{display:block;height:100%;width:0;background:var(--tx)}
.lp-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.lp-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 4px;min-height:340px}
.lp-z{position:absolute;top:0;bottom:0;background:none;border:0;z-index:2;padding:0}
.lp-z.l{left:0;width:30%}
.lp-z.r{right:0;width:70%}
.lp-stage.done .lp-z{display:none}
.sc{position:relative;z-index:1;width:100%;animation:scIn .35s ease both}
.sc-e{font-size:84px;line-height:1;margin-bottom:18px;display:inline-block}
.sc-t{font:700 24px/1.2 'Unbounded',sans-serif;margin:0 0 12px;letter-spacing:-.02em}
.sc-s{font-size:18px;line-height:1.5;margin:0 auto;max-width:420px}
.lp-ctl{display:flex;gap:8px;justify-content:center;margin-top:8px}
.lp-ctl .btn + .btn{margin-top:0}
@keyframes scIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes breath{0%,100%{transform:scale(.8)}50%{transform:scale(1.25)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wave{0%,100%{transform:translateX(-8px) rotate(-4deg)}50%{transform:translateX(8px) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.a-pulse{animation:pulse 2.2s ease-in-out infinite}
.a-breath{animation:breath 5s ease-in-out infinite}
.a-float{animation:floaty 2.6s ease-in-out infinite}
.a-wave{animation:wave 3s ease-in-out infinite}
.a-pop{animation:pop .6s ease both}
.big-money{font:700 40px/1.1 'Unbounded',sans-serif;letter-spacing:-.03em;margin:10px 0 6px;font-variant-numeric:tabular-nums;word-break:break-word}
@media (prefers-reduced-motion:reduce){.a-pulse,.a-breath,.a-float,.a-wave,.sc{animation:none!important}}

:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.orb i{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><img class="logo" id="logoImg" alt="Safe Space"></div>
    <button class="sos-pill" id="sosPill" data-act="go" data-s="sos">🆘 SOS</button>
  </header>
  <main id="view"></main>
</div>

<nav id="nav"><div class="in">
  <button data-act="tab" data-t="home"><span class="e">🏠</span>Главная</button>
  <button data-act="tab" data-t="quiz"><span class="e">🧠</span>Тесты</button>
  <button data-act="tab" data-t="journal"><span class="e">📓</span>Дневник</button>
  <button data-act="tab" data-t="chat"><span class="e">💬</span>Помощник</button>
  <button data-act="tab" data-t="profile"><span class="e">👤</span>Профиль</button>
</div></nav>

<div id="modal"></div>
<div id="toast"></div>
<div id="splash"></div>
<div id="onboard"></div>

/* IDF по базе знаний: редкие слова весят больше */
let QA_IDF = null, QA_VOCAB = null;
function qaBuild(){
  if(QA_IDF) return;
  const df = new Map(); QA_VOCAB = new Set();
  QA.forEach(e=>{
    const fs = new Set();
    e.k.forEach(q => feats(q).forEach(f => { QA_VOCAB.add(f); if(!f.includes('_') && (f.length<3 || STOP.has(f))) return; fs.add(f); }));
    fs.forEach(f => df.set(f,(df.get(f)||0)+1));
  });
  QA_IDF = new Map([...df].map(([f,d]) => [f, Math.log((QA.length+1)/(d+1))+1]));
}
/* расстояние Левенштейна с отсечкой: считает только «почти такие же» слова.
   Благодаря ему «старица франации» находит «столица франции» */
function ed2(a,b){
  if(a===b) return true;
  const la=a.length, lb=b.length;
  if(Math.abs(la-lb)>2 || la<4 || lb<4) return false;
  let prev=new Array(lb+1); for(let j=0;j<=lb;j++) prev[j]=j;
  for(let i=1;i<=la;i++){
    const cur=[i]; let rowMin=i;
    for(let j=1;j<=lb;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<rowMin) rowMin=cur[j];
    }
    if(rowMin>2) return false;
    prev=cur;
  }
  return prev[lb]<=2;
}
/* исправляем опечатки: каждое незнакомое слово меняем на ближайшее из словаря базы */
function qaWords(text){
  const ws = tok(text).map(stem);
  const fixed = ws.map(w=>{
    if(w.length<4 || QA_VOCAB.has(w)) return w;
    let best=null, bl=99;
    for(const v of QA_VOCAB){
      if(v.includes('_')) continue;
      if(Math.abs(v.length-w.length)>2 || Math.abs(v.length-w.length)>=bl) continue;
      if(ed2(w,v)){ const d=Math.abs(v.length-w.length); if(d<bl){bl=d; best=v;} }
    }
    return best||w;
  });
  const f=new Set(fixed);
  for(let i=0;i<fixed.length-1;i++) f.add(fixed[i]+'_'+fixed[i+1]);
  return [...f];
}
function qaAnswer(text){
  qaBuild();
  const ufs = qaWords(text).filter(f => !f.includes('_') ? (f.length>=3 && !STOP.has(f)) : true);
  if(!ufs.length) return null;
  let best=null, bestScore=0, bestHits=0;
  for(const e of QA){
    const set = new Set(); e.k.forEach(q => feats(q).forEach(f => set.add(f)));
    let score=0, hits=0;
    for(const f of ufs){
      if(set.has(f)){
        const w = QA_IDF.get(f) || (f.includes('_') ? 2 : 1);
        score += f.includes('_') ? 2*w : w;
        if(!f.includes('_')) hits++;
      }
    }
    score = score / Math.sqrt(ufs.length);
    if(hits>=2 && score>bestScore){ bestScore=score; best=e; bestHits=hits; }
  }
  if(!best || bestScore<2.2) return null;
  return {text: typeof best.a==='function' ? best.a() : best.a, acts:best.acts, _s:bestScore};
}

  }catch(e){}

}

/* слова → признаки: обрезаем окончания и добавляем пары слов,
   чтобы сеть понимала разные формы одного слова */
function tok(s){ return s.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim().split(/\s+/).filter(Boolean); }
function stem(w){ return w.length>6 ? w.slice(0,w.length-3) : w.length>4 ? w.slice(0,w.length-2) : w; }
function feats(s){ const t=tok(s).map(stem); const f=new Set(t); for(let i=0;i<t.length-1;i++) f.add(t[i]+'_'+t[i+1]); return [...f]; }

/* обучение: строим словарь признаков и 350 эпох градиентного спуска.
   Занимает доли секунды и происходит один раз — при первом открытии чата. */
let NET = null;
function ensureNet(){
  if(NET) return;
  const vocab=new Map(), samples=[];
  INTENTS.forEach((c,ci)=>c.train.forEach(text=>{
    const idx=[];
    for(const f of feats(text)){ let id=vocab.get(f); if(id===undefined){ id=vocab.size; vocab.set(f,id); } idx.push(id); }
    samples.push({x:idx,y:ci});
  }));
  const V=vocab.size, C=INTENTS.length;
  const W=new Float32Array(V*C), B=new Float32Array(C);
  const order=[...samples.keys()];
  for(let ep=0;ep<350;ep++){
    for(let i=order.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [order[i],order[j]]=[order[j],order[i]]; }
    const rate=0.6/(1+ep*0.01);
    for(const si of order){
      const s=samples[si], scores=new Float32Array(C);
      for(const id of s.x) for(let c=0;c<C;c++) scores[c]+=W[id*C+c];
      for(let c=0;c<C;c++) scores[c]+=B[c];
      let mx=-1e9; for(let c=0;c<C;c++) if(scores[c]>mx) mx=scores[c];
      let sum=0; for(let c=0;c<C;c++){ scores[c]=Math.exp(scores[c]-mx); sum+=scores[c]; }
      for(let c=0;c<C;c++){
        const g=scores[c]/sum-(c===s.y?1:0);
        B[c]-=rate*g;
        for(const id of s.x) W[id*C+c]-=rate*g;
      }
    }
  }
  NET={vocab,W,B,C};
  NET_WORDS=new Set([...vocab.keys()].filter(k=>!k.includes('_')&&k.length>=4));
  EXACT=new Map(); INTENTS.forEach(c=>c.train.forEach(x=>EXACT.set(x.toLowerCase().replace(/ё/g,'е'),c.id)));
}
let NET_WORDS=null, EXACT=null;
/* исправляем опечатки по словарю нейросети («тяговато», «тагово» → «тяга» и т.п.) */
function netFeats(text){
  const ws = tok(text).map(stem);
  const fixed = ws.map(w=>{
    if(w.length<4 || NET.vocab.has(w)) return w;
    let best=null;
    for(const v of NET_WORDS){ if(Math.abs(v.length-w.length)>2) continue; if(ed2(w,v)){ best=v; break; } }
    return best||w;
  });
  const f=new Set(fixed); for(let i=0;i<fixed.length-1;i++) f.add(fixed[i]+'_'+fixed[i+1]);
  return [...f];
}
/* классификация: softmax по признакам фразы.
   Защита от ложных срабатываний: если нашлось меньше двух знакомых слов,
   уверенность должна быть высокой, иначе отвечаем нейтрально. */
function classifyNet(text){
  ensureNet();
  const {vocab,W,B,C}=NET, scores=new Float32Array(C);
  let hit=0;
  for(const f of netFeats(text)){ const id=vocab.get(f); if(id===undefined) continue; hit++;
    for(let c=0;c<C;c++) scores[c]+=W[id*C+c]; }
  if(!hit) return null;
  for(let c=0;c<C;c++) scores[c]+=B[c];
  let mx=-1e9; for(const v of scores) if(v>mx) mx=v;
  let sum=0; const probs=[];
  for(let c=0;c<C;c++){ const p=Math.exp(scores[c]-mx); sum+=p; probs.push(p); }
  let best=0; for(let c=1;c<C;c++) if(probs[c]>probs[best]) best=c;
  return {id:INTENTS[best].id, prob:probs[best]/sum, hit};
}

const PATTERNS = {
  '478':{name:'4-7-8',steps:[['Вдох',4,1],['Задержка',7,1],['Выдох',8,.55]]},
  'box':{name:'Квадрат 4-4-4-4',steps:[['Вдох',4,1],['Задержка',4,1],['Выдох',4,.55],['Пауза',4,.55]]},

  <div class="orb" data-act="brtoggle" role="button" aria-label="Начать дыхательную технику"><i id="orb"></i></div>
  <div class="center"><div class="phase" id="orbTx">Нажми на круг или «Начать»</div><div class="muted" id="cyc">&nbsp;</div></div>
  <div class="sp"></div>
  <button class="btn" id="brBtn" data-act="brstart">Начать</button>

function paintBreathBtn(){
  const b=$('#brBtn'); if(!b) return;
  b.textContent = BR.running ? 'Остановить' : 'Начать';
  b.dataset.act = BR.running ? 'brstop' : 'brstart';
}
const easeIO = p => p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
const orbSet = v => { const o=$('#orb'); if(o) o.style.transform='scale('+v+')'; };
/* плавный сдвиг круга на заданную позицию — одинаково работает на Android и ПК */
function orbTween(to, ms){
  cancelAnimationFrame(BR.raf);
  const o=$('#orb'); if(!o) return;
  const m=/scale\(([\d.]+)\)/.exec(o.style.transform); const from=m?+m[1]:.55;
  const t0=Date.now();
  const step=()=>{ const p=Math.min(1,(Date.now()-t0)/ms); orbSet(from+(to-from)*easeIO(p));
    if(p<1) BR.raf=requestAnimationFrame(step); };
  BR.raf=requestAnimationFrame(step);
}
function breathRun(){
  const id=++BR.id; BR.running=true; paintBreathBtn(); hap('light');
  const steps=PATTERNS[BR.pat].steps;
  /* таймлайн всей техники: [подпись, длительность мс, масштаб от, масштаб до, круг] */
  const tl=[]; let prev=.55;
  for(let c=1;c<=5;c++) for(const [label,sec,to] of steps){ tl.push([label,sec*1000,prev,to,c]); prev=to; }
  const total=tl.reduce((s,x)=>s+x[1],0), t0=Date.now();
  let lastTx='', lastCyc='', lastSeg=-1;
  const frame=()=>{
    if(BR.id!==id || !BR.running) return;
    if(!$('#orb')) return;
    const el=Date.now()-t0;
    if(el>=total){ breathFinish(); return; }
    let acc=0, seg=tl[tl.length-1], start=0, si=tl.length-1;
    for(let i=0;i<tl.length;i++){ if(el<acc+tl[i][1]){ seg=tl[i]; start=acc; si=i; break; } acc+=tl[i][1]; }
    orbSet(seg[2]+(seg[3]-seg[2])*easeIO((el-start)/seg[1]));
    if(si!==lastSeg){ lastSeg=si; hap('light'); }
    const t=`${seg[0]} · ${Math.max(1,Math.ceil((start+seg[1]-el)/1000))}`;
    const c=`Круг ${seg[4]} из 5`;
    const tx=$('#orbTx'), cyc=$('#cyc');
    if(tx&&t!==lastTx){ tx.textContent=t; lastTx=t; }
    if(cyc&&c!==lastCyc){ cyc.textContent=c; lastCyc=c; }
    BR.raf=requestAnimationFrame(frame);
  };
  BR.raf=requestAnimationFrame(frame);
}
function breathFinish(){
  BR.running=false; paintBreathBtn(); hap('success');
  const tx=$('#orbTx'); if(tx) tx.textContent='Готово 🌿';
  const cyc=$('#cyc'); if(cyc) cyc.textContent='Как ты себя чувствуешь?';
}
function breathStop(){
  BR.id++; BR.running=false; paintBreathBtn();
  orbTween(.55, 600);
  const tx=$('#orbTx'); if(tx) tx.textContent='Нажми на круг или «Начать»';
  const cyc=$('#cyc'); if(cyc) cyc.textContent='\u00a0';
}

function chatReply(text){
  const t = text.toLowerCase().replace(/ё/g,'е').trim();
  /* Контекст диалога: короткие реплики не классифицируем как новую тему.
     Используем только недавние сообщения этого открытого чата, без отправки наружу. */
  const userTurns = chatLog.filter(m => m.me && typeof m.text === 'string');
  /* chatSendText уже добавил текущую реплику в chatLog, поэтому берём предыдущую. */
  const lastUser = userTurns.length > 1 ? userTurns[userTurns.length - 2].text : '';
  const lastBot = [...chatLog].reverse().find(m => !m.me && typeof m.text === 'string');
  const shortFollow = /^(почему|зачем|как именно|подробнее|расскажи подробнее|продолжи|дальше|и что|что дальше|а потом|и потом|например|можно пример|объясни|не понял(?:а)?|не понимаю|да|нет|наверное|возможно|ок|ладно|понятно|и что делать|что мне делать дальше)[.!?… ]*$/i.test(t)
    || /^(а если|а как|а что если|и если)\b/i.test(t);
  if (shortFollow && lastBot && lastUser) {
    const prev = lastBot.text;
    const crisisFollow = /(не хочу жить|покончить с собой|навредить себе|небезопасно|непосредственной опасности)/i.test(prev);
    if (crisisFollow) {
      return {text:'Спасибо, что продолжаешь отвечать. Я хочу сначала убедиться, что ты в безопасности: ты сейчас можешь причинить себе вред или рядом есть человек, который может тебе навредить? Если да — отойди к безопасному человеку и позвони 112 или местному экстренному номеру. Я останусь с тобой в этом разговоре.', acts:[['sos','🆘 Открыть помощь']]};
    }
    if (/^(да|нет|наверное|возможно|ок|ладно|понятно)[.!?… ]*$/i.test(t)) {
      return {text:'Поняла. Чтобы не додумывать за тебя: ты согласен(на) с тем, что я предложила, или хочешь выбрать другой вариант? Можешь ответить своими словами — я буду держаться этой темы.'};
    }
    if (/^(продолжи|дальше|подробнее|расскажи подробнее|объясни|например|можно пример|не понял(?:а)?|не понимаю|почему|зачем|и что|что дальше|а потом|и потом|и что делать|что мне делать дальше)[.!?… ]*$/i.test(t)
      || /^(а если|а как|а что если|и если)\b/i.test(t)) {
      const topic = lastUser.slice(0,180);
      return {text:`Давай продолжим, не меняя тему. Ты написал(а): «${topic}».\n\nЯ не хочу придумывать детали, которых не знаю. Уточни, пожалуйста, что именно разобрать дальше: причины, конкретные шаги или пример фразы/ситуации? Если удобнее, опиши один следующий момент — я отвечу именно на него.`};
    }
  }
  /* 0. Опасные физические симптомы — выше классификатора. */
  const alcoholEmergency = /(не просыпа|не приходит в себя|без сознани|потерял сознани|трудно дыш|редко дыш|дыхание редк|синеют губ|судорог|не могу разбуд|передозир|отравил.*таблет|смешал.*таблет|алкогол.*не реагир|рвот.*без сознани)/i.test(t);
  if(alcoholEmergency) return {text:'🚨 Это может быть опасно для жизни. Немедленно звони 112 (или местный номер экстренной помощи) и следуй указаниям диспетчера. Не оставляй человека одного, не вызывай рвоту и не давай еду, напитки или лекарства человеку с нарушенным сознанием. Если он без сознания, но дышит нормально, уложи на бок; если не дышит нормально — сообщи диспетчеру и выполняй его инструкции. Не жди, пока «проспится».', acts:[['sos','🆘 Открыть помощь']]};
  const abuseRisk = /(меня бьют|избивает|изнасил|трогает против моей воли|принужда.*секс|сексуальн.*насили|угрожает мне|мне угрожают|меня преследуют|боюсь возвращаться домой|дома небезопасно|меня заперли)/i.test(t);
  if(abuseRisk) return {text:'Мне жаль, что это происходит. Ты не виноват(а), и безопасность важнее обещаний хранить секрет. Если опасность прямо сейчас — уйди туда, где есть безопасные люди, и звони 112/местному экстренному номеру. Не вступай в конфронтацию с человеком, который может причинить вред. Свяжись с безопасным взрослым, школьным психологом или местной службой помощи; если телефон проверяют, используй безопасное устройство, когда это возможно.', acts:[['sos','🆘 Открыть помощь']]};
  /* 1. кризис — только жёсткие правила, без нейросети */
  if(CRISIS_KEYS.some(k=>t.includes(k))){
    return {text:`Мне важно то, что ты сейчас чувствуешь. Спасибо, что написал(а). Если есть риск, что ты навредишь себе прямо сейчас, отойди от опасных предметов/лекарств, перейди туда, где есть безопасный человек, и прямо скажи ему: «Мне небезопасно оставаться одному/одной». Не оставайся в одиночестве.\n\n🚨 ${CONFIG.emergency} — если опасность немедленная (или местный экстренный номер, если ты не в России).\n📞 ${CONFIG.hotlineLabel} — ${CONFIG.hotlineName.toLowerCase()} в России; доступность и часы работы лучше уточнить.\n\nТы можешь ответить одним словом: ты сейчас в непосредственной опасности?`, acts:[['sos','🆘 Открыть помощь']]};
  }
  /* 2. точные динамические ответы: примеры, время, дата */
  const dyn = tryMath(text) || tryTimeDate(t);
  if(dyn) return {text:dyn};
  /* 3. понимаем, вопрос ли это */
  const QW = ['как','почему','зачем','что','когда','где','куда','скольк','можно','правда','вредн','есть','кто','чей','какой','какая','какие','какое','стоит','бывает'];
  const isQ = /\?\s*$/.test(text) || /(^|\s)л[иь](\s|$)/.test(t) || tok(text).slice(0,3).some(w => QW.some(q => w.startsWith(q)));
  /* быстрый путь: фраза точно совпадает с обучающим примером —
     отвечаем уверенно, даже если это одно слово («да», «ок», «пока», «тяга») */
  ensureNet();
  if(EXACT && EXACT.has(t)){
    const cat = INTENTS.find(c=>c.id===EXACT.get(t));
    const rep = pick(cat.replies);
    return {text: typeof rep==='function' ? rep() : rep, acts:cat.acts, qs:cat.qs};
  }
  const r = classifyNet(text);
  const qa = qaAnswer(text);
  /* Не отвечаем по случайно угаданному интенту: нужен более сильный сигнал.
     Короткие и незнакомые реплики уходят в уточнение, а не в случайную тему. */
  const netOk = r && r.prob>=0.56 && (r.hit>=2 || r.prob>=0.78) && tok(text).length>=2;
  /* 4. вопросы — в базу знаний, утверждения — в нейросеть */
  if(qa && (isQ || !netOk || r.prob<0.85 || qa._s>=3.4)) return qa;
  if(netOk){
    /* защита от угадывания: вопрос со «светским» интентом и незнакомым
       содержательным словом → честный ответ с цитатой, а не фантазия */
    const SMALLTALK = new Set(['greeting','howru','who','creator','joke','weather','compliment','insult','help','thanks']);
    if(isQ && SMALLTALK.has(r.id)){
      const unk = tok(text).map(stem).filter(w => w.length>=4 && !STOP.has(w) && !NET.vocab.has(w) && !(QA_VOCAB && QA_VOCAB.has(w)));
      if(unk.length) return smartFallback(text, true);
    }
    const cat = INTENTS.find(c=>c.id===r.id);
    const rep = pick(cat.replies);
    return {text: typeof rep==='function' ? rep() : rep, acts:cat.acts, qs:cat.qs};
  }
  if(qa) return qa;
  /* 5. честный запасной ответ */
  return smartFallback(text, isQ);
}
let chatBusy = false;
function chatSendText(text){
  if(chatBusy) return;
  const box=$('#msgs'); if(!box) return;
  chatBusy=true;
  const me={me:true,text}; chatLog.push(me); box.insertAdjacentHTML('beforeend',msgHtml(me));
  const chips=$('#chatChips'); if(chips) chips.remove();
  box.insertAdjacentHTML('beforeend','<div class="msg" id="typing"><span class="typing"><i></i><i></i><i></i></span></div>');
  window.scrollTo(0, document.body.scrollHeight);
  setTimeout(()=>{
    chatBusy=false;
    const tp=$('#typing'); if(tp) tp.remove();
    if(cur.name!=='chat') return;
    const r=chatReply(text); chatLog.push(r); $('#msgs').insertAdjacentHTML('beforeend',msgHtml(r));
    hap('light'); window.scrollTo(0, document.body.scrollHeight);
  }, 700+Math.random()*800);
}
function chatSend(){
  const inp=$('#chatIn'); if(!inp) return;
  const text=inp.value.trim(); if(!text) return;
  inp.value=''; chatSendText(text);
}

    const p = pickQuestions(d.id);

    if(!Q) return;

    const pct=Math.round(Q.score/(n*3)*100), t=dateKey(), reward=rewardFor(Q.id);
    const last=S.history.length ? S.history[S.history.length-1].percent : null;
    const trend = last===null ? 'старт фиксации' : pct>last ? 'улучшение ▲' : pct<last ? 'ниже прошлого ▽' : 'стабильно';
    S.history.push({date:t,type:Q.id,percent:pct,trend}); S.history=S.history.slice(-30);
    S.seen[Q.id] = (Q.reset ? [] : (S.seen[Q.id]||[])).concat(Q.idx);
    S.qAt[Q.id]=Date.now(); S.qRew[Q.id]=t; S.done[Q.id]=t; S.balance+=reward; save(); Q=null;

let splashDone = false;
function showSplash(next){
  const sp=$('#splash'); if(!sp){ next&&next(); return; }
  splashDone=false;
  sp.style.display='flex'; sp.classList.remove('gone');
  sp.innerHTML=`<video src="${INTRO_URI}" autoplay muted playsinline></video>
    <button class="skip" data-act="spskip">Пропустить ›</button>`;
  const v=sp.querySelector('video');
  const fin=()=>{ if(splashDone) return; splashDone=true; next&&next(); };
  v.addEventListener('ended',fin); v.addEventListener('error',fin);
  setTimeout(fin, 8000);          // страховка, если видео не сработало
  try{ const p=v.play&&v.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
}
function skipSplash(){
  const v=$('#splash') && $('#splash').querySelector('video');
  if(v){ try{ v.pause(); }catch(e){} v.dispatchEvent(new Event('ended')); }
}
function hideSplash(){
  const sp=$('#splash'); if(!sp) return;
  sp.classList.add('gone');
  setTimeout(()=>{ sp.style.display='none'; sp.innerHTML=''; },500);
}
function greetThen(){
  const sp=$('#splash'); if(!sp) return;
  sp.style.display='flex'; sp.classList.remove('gone');
  const name = S.user&&S.user.name ? ', '+esc(S.user.name) : '';
  sp.innerHTML=`<img class="logo-big" src="${LOGO_URI}" alt="Safe Space"><div class="hello">Здравствуйте${name} 🤍</div>`;
  setTimeout(hideSplash, 2400);
}
let obSex = null, obEdit = false;
function showOnboard(){
  const ob=$('#onboard'); if(!ob) return;
  obEdit = !!(S.user&&S.user.name);
  obSex = S.user ? S.user.sex : null;
  const u = S.user || {};
  ob.style.display='flex'; ob.classList.remove('gone');
  ob.innerHTML=`<div class="ob-card">
    <h2>${obEdit?'Мои данные ✏️':'Знакомимся ✨'}</h2>
    <p class="muted">${obEdit?'Можно изменить данные — они хранятся только на этом устройстве.':'Пара вопросов, чтобы обращаться к тебе правильно. Всё останется на этом устройстве.'}</p>
    <h3>1. Ваше имя</h3>
    <input type="text" id="obName" maxlength="20" value="${esc(u.name||'')}" placeholder="Как к тебе обращаться?">
    <div class="sp"></div>
    <h3>2. Ваш возраст</h3>
    <input type="number" id="obAge" inputmode="numeric" min="7" max="99" value="${u.age||''}" placeholder="Сколько тебе лет?">
    <div class="sp"></div>
    <h3>3. Ваш пол</h3>
    <div>
      <button class="chip ob-sex ${u.sex==='m'?'on':''}" data-act="obsex" data-s="m">🙋‍♂️ Парень</button>
      <button class="chip ob-sex ${u.sex==='f'?'on':''}" data-act="obsex" data-s="f">🙋‍♀️ Девушка</button>
    </div>
    <div class="sp"></div>
    <button class="btn" data-act="obgo">${obEdit?'Сохранить':'Продолжить ›'}</button>
  </div>`;
}
function obSubmit(){
  const nameEl=$('#obName');
  const name = nameEl ? nameEl.value.trim().slice(0,20) : '';
  if(!name){ toast('Напиши, как к тебе обращаться'); hap('warning'); return; }
  const ageRaw = parseInt($('#obAge') && $('#obAge').value, 10);
  const age = (ageRaw>=7 && ageRaw<=99) ? ageRaw : null;
  S.user = {name, age, sex:obSex}; save(); hap('success');
  const ob=$('#onboard');
  if(ob){ ob.classList.add('gone'); setTimeout(()=>{ ob.style.display='none'; ob.innerHTML=''; },450); }
  if(obEdit){ render(); toast('Данные обновлены'); } else greetThen();
}

/* старт */
$('#logoImg').src = LOGO_URI;
render();
checkMilestones(true);
showSplash(()=>{ if(S.user) greetThen(); else { hideSplash(); showOnboard(); } });
})();
</script>
